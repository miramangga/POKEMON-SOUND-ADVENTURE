<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Sound Adventure: The Great Phonics Quest</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            user-select: none;
            overflow-x: hidden;
        }
        .font-pixel {
            font-family: 'Press Start 2P', cursive;
        }
        .pkmn-window {
            background: linear-gradient(135deg, #ffffff 0%, #f0f4f8 100%);
            border: 4px solid #222222;
            box-shadow: 0 10px 0 #000000;
            color: #222222;
        }
        .pkmn-dialogue {
            background: #ffffff;
            border: 3px solid #222222;
            border-radius: 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        @keyframes floatAnimation {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: floatAnimation 3s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 203, 5, 0.8); }
            50% { box-shadow: 0 0 30px rgba(255, 203, 5, 1); }
        }
        .animate-pulse-glow {
            animation: pulseGlow 2s infinite;
        }
        .node-beacon {
            animation: pingBeacon 2s infinite;
        }
        @keyframes pingBeacon {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 0.3; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 relative">

    <!-- Dynamic Background Canvas -->
    <canvas id="bg-canvas" class="fixed inset-0 w-full h-full pointer-events-none z-0 opacity-40"></canvas>

    <!-- Toast Alert Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm"></div>

    <!-- Main Game Wrapper -->
    <main id="app-wrapper" class="relative z-10 w-full max-w-5xl flex flex-col items-center justify-center">
        <!-- Top Navigation / Stats Bar -->
        <header id="game-header" class="w-full mb-3 hidden">
            <div class="pkmn-window p-3 rounded-xl flex items-center justify-between shadow-lg">
                <div class="flex items-center gap-3">
                    <button id="map-btn" onclick="gameState.currentScreen='MAP'; renderApp();" class="hidden bg-[#cc0000] hover:bg-[#b30000] text-yellow-300 font-pixel text-[10px] sm:text-xs px-3 py-2 rounded-lg border-2 border-[#222] shadow transform active:scale-95 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-map"></i> MAP
                    </button>
                    <!-- TEACHER DIRECT NAVIGATION MENU -->
                    <div class="relative group">
                        <button class="bg-[#7b1fa2] hover:bg-[#6a1b9a] text-yellow-300 font-pixel text-[10px] sm:text-xs px-3 py-2 rounded-lg border-2 border-[#222] shadow transform active:scale-95 transition flex items-center gap-1.5">
                            <i class="fa-solid fa-user-gear"></i> TEACHER NAV <i class="fa-solid fa-caret-down"></i>
                        </button>
                        <div class="absolute left-0 top-full mt-1 bg-white border-3 border-[#222] rounded-xl shadow-2xl p-2 hidden group-hover:flex flex-col gap-1.5 z-50 min-w-[200px]">
                            <div class="font-pixel text-[9px] text-[#7b1fa2] font-bold px-2 py-1 border-b border-gray-200">
                                🎓 DIRECT MISSION ACCESS
                            </div>
                            <button onclick="gameState.teacherJumpTo('MISSION1')" class="text-left font-pixel text-[10px] text-[#222] hover:bg-[#e8f5e9] p-2 rounded transition flex items-center gap-2">
                                <i class="fa-solid fa-tree text-[#2e7d32]"></i> Route 101 (Mission 1)
                            </button>
                            <button onclick="gameState.teacherJumpTo('MISSION2')" class="text-left font-pixel text-[10px] text-[#222] hover:bg-[#e1f5fe] p-2 rounded transition flex items-center gap-2">
                                <i class="fa-solid fa-water text-[#0288d1]"></i> Route 102 (Mission 2)
                            </button>
                            <button onclick="gameState.teacherJumpTo('MISSION3')" class="text-left font-pixel text-[10px] text-[#222] hover:bg-[#f3e5f5] p-2 rounded transition flex items-center gap-2">
                                <i class="fa-solid fa-gem text-[#7b1fa2]"></i> Route 103 (Mission 3)
                            </button>
                            <button onclick="gameState.teacherJumpTo('ASSESSMENT')" class="text-left font-pixel text-[10px] text-[#222] hover:bg-[#ffebee] p-2 rounded transition flex items-center gap-2">
                                <i class="fa-solid fa-shield-cat text-[#cc0000]"></i> Pokémon League
                            </button>
                            <button onclick="gameState.teacherJumpTo('RESULTS')" class="text-left font-pixel text-[10px] text-[#222] hover:bg-amber-50 p-2 rounded transition flex items-center gap-2 border-t border-gray-200">
                                <i class="fa-solid fa-headphones text-amber-600"></i> Teacher Report
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center gap-2">
                        <img id="header-partner-img" src="" class="w-8 h-8 object-contain animate-float" alt="Partner Avatar">
                        <div>
                            <span id="header-trainer-name" class="font-pixel text-[10px] text-[#cc0000] font-bold block leading-tight">Trainer</span>
                            <span id="header-partner-name" class="font-pixel text-[9px] text-[#555] block leading-tight">Pikachu</span>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <span id="header-stage-badge" class="font-pixel text-[9px] sm:text-[10px] bg-[#ffcb05] text-[#222] px-2.5 py-1.5 rounded-lg border border-[#b38f00] font-bold shadow-sm hidden sm:inline-block">
                        OVERWORLD
                    </span>
                    <div class="bg-[#222] text-yellow-300 font-pixel text-[10px] sm:text-xs px-3 py-1.5 rounded-lg border-2 border-[#ffcb05] flex items-center gap-1.5 shadow">
                        <i class="fa-solid fa-gem text-cyan-300 animate-pulse"></i>
                        <span id="header-crystals">0</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Dynamic Screen Content Container -->
        <div id="app-container" class="w-full flex items-center justify-center"></div>
    </main>

    <script>
        // Game Configuration Data
        const GAME_CONFIG = {
            partners: [
                { id: 'pikachu', name: 'Pikachu', type: 'Electric', icon: '⚡', avatar: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png' },
                { id: 'eevee', name: 'Eevee', type: 'Normal', icon: '⭐', avatar: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png' },
                { id: 'charmander', name: 'Charmander', type: 'Fire', icon: '🔥', avatar: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/4.png' },
                { id: 'bulbasaur', name: 'Bulbasaur', type: 'Grass', icon: '🌿', avatar: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1.png' },
                { id: 'squirtle', name: 'Squirtle', type: 'Water', icon: '💧', avatar: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/7.png' },
                { id: 'jigglypuff', name: 'Jigglypuff', type: 'Fairy', icon: '🎤', avatar: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/39.png' }
            ],
            targetWords: [
                { word: 'day', soundGroup: 'ay', example: 'We can walk outside on a sunny day.', m3Sentence: 'The children fly a kite all ___ long.', m3Choice: 'day' },
                { word: 'pay', soundGroup: 'ay', example: 'My mother will give coins to pay for books at the shop.', m3Sentence: 'I will ___ for my entrance ticket at the counter.', m3Choice: 'pay' },
                { word: 'boy', soundGroup: 'oy', example: 'The little boy is smiling at his teacher.', m3Sentence: 'That happy ___ kicked the golden football.', m3Choice: 'boy' },
                { word: 'toy', soundGroup: 'oy', example: 'Mei Mei likes her new toy car.', m3Sentence: 'She put her favorite colorful ___ back into the box.', m3Choice: 'toy' }
            ],
            assessmentWords: [
                { id: 'word_1', word: 'ray', soundGroup: 'ay' },
                { id: 'word_2', word: 'Roy', soundGroup: 'oy' },
                { id: 'word_3', word: 'say', soundGroup: 'ay' },
                { id: 'word_4', word: 'coy', soundGroup: 'oy' }
            ]
        };

        // Web Audio API Synthesizer
        const audioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playTone(freq, type = 'sine', duration = 0.2) {
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            },
            playSuccess() {
                this.playTone(523.25, 'triangle', 0.15);
                setTimeout(() => this.playTone(659.25, 'triangle', 0.15), 100);
                setTimeout(() => this.playTone(783.99, 'triangle', 0.3), 200);
            },
            playHop() {
                this.playTone(400, 'sine', 0.1);
            },
            playFanfare() {
                this.playTone(523.25, 'square', 0.15);
                setTimeout(() => this.playTone(659.25, 'square', 0.15), 150);
                setTimeout(() => this.playTone(783.99, 'square', 0.15), 300);
                setTimeout(() => this.playTone(1046.50, 'square', 0.4), 450);
            },
            speakWord(text) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const synth = new SpeechSynthesisUtterance(text);
                    synth.rate = 0.85;
                    synth.pitch = 1.1;
                    synth.lang = 'en-US';
                    window.speechSynthesis.speak(synth);
                }
            }
        };

        // Background Particle Canvas Initialization
        function initBackgroundCanvas() {
            const canvas = document.getElementById('bg-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let particles = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 3 + 1,
                    speedY: -Math.random() * 1 - 0.2,
                    speedX: (Math.random() - 0.5) * 0.5,
                    color: Math.random() > 0.5 ? '#ffcb05' : '#4fc3f7',
                    alpha: Math.random() * 0.5 + 0.3
                });
            }

            function animateBg() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.y += p.speedY;
                    p.x += p.speedX;
                    if (p.y < 0) {
                        p.y = canvas.height;
                        p.x = Math.random() * canvas.width;
                    }
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.fill();
                });
                requestAnimationFrame(animateBg);
            }
            animateBg();
        }

        // Global State Management
        const gameState = {
            trainerName: '',
            partner: GAME_CONFIG.partners[0],
            crystals: 0,
            currentScreen: 'HOME', // HOME, MAP, MISSION1, MISSION2, MISSION3, ASSESSMENT, RESULTS

            isTraveling: false,
            travelMessage: '',

            // Audio Recording State
            isRecording: false,
            mediaRecorder: null,
            audioChunks: [],
            recordingTimer: null,
            recordingTimeLeft: 3,
            recordedAudioUrl: null,

            // Mission Flags
            m1ListenedUserVoice: false,
            m1TriedCurrent: false,

            m2WordIdentified: false,
            m2ReadAttempted: false,
            m2ListenedUserVoice: false,

            m3ReadAttempted: false,
            m3Solved: false,
            m3ReadFullSentenceAttempted: false,
            m3AudioListened: false,
            m3UserVoiceListened: false,

            assessmentIndex: 0,
            assessmentTriedCurrent: false,

            unlockedMissions: { mission1: true, mission2: false, mission3: false, assessment: false },
            completedMissions: { mission1: false, mission2: false, mission3: false, assessment: false },

            missionLogs: { mission1: [], mission2: [], mission3: [], assessment: [] },

            // Assessment Teacher Notes & Awarded Crystals tracking
            assessmentTeacherNotes: {},
            assessmentAwardedCrystals: {},

            mission1Index: 0,
            mission2Index: 0,
            mission3Index: 0,

            resetCurrentMissionState() {
                this.isRecording = false;
                if (this.recordingTimer) clearInterval(this.recordingTimer);
                this.recordedAudioUrl = null;
                
                // M1 flags
                this.m1TriedCurrent = false;
                this.m1ListenedUserVoice = false;

                // M2 flags
                this.m2WordIdentified = false;
                this.m2ReadAttempted = false;
                this.m2ListenedUserVoice = false;

                // M3 flags
                this.m3ReadAttempted = false;
                this.m3Solved = false;
                this.m3ReadFullSentenceAttempted = false;
                this.m3AudioListened = false;
                this.m3UserVoiceListened = false;

                // Assessment flags
                this.assessmentTriedCurrent = false;
            },

            teacherJumpTo(screenName) {
                this.unlockedMissions.mission1 = true;
                this.unlockedMissions.mission2 = true;
                this.unlockedMissions.mission3 = true;
                this.unlockedMissions.assessment = true;
                
                if (!this.trainerName) {
                    this.trainerName = "Teacher Mode";
                }
                
                this.resetCurrentMissionState();
                this.currentScreen = screenName;
                audioFX.playSuccess();
                showToast(`Teacher Mode: Jumped to ${screenName}`, 'success');
                renderApp();
            },

            toggleAssessmentCrystal(wordId) {
                if (!this.assessmentAwardedCrystals[wordId]) {
                    this.assessmentAwardedCrystals[wordId] = true;
                    this.crystals += 1;
                    audioFX.playSuccess();
                    showToast(`Awarded 1 Sound Crystal for ${wordId}!`, 'success');
                } else {
                    this.assessmentAwardedCrystals[wordId] = false;
                    this.crystals = Math.max(0, this.crystals - 1);
                    audioFX.playTone(250, 'sine', 0.2);
                    showToast(`Removed Crystal for ${wordId}.`, 'info');
                }
                renderApp();
            },

            updateTeacherNote(wordId, noteText) {
                this.assessmentTeacherNotes[wordId] = noteText;
            },

            addCrystals(count) {
                this.crystals += count;
                audioFX.playSuccess();
            },

            returnToMap() {
                this.resetCurrentMissionState();
                this.currentScreen = 'MAP';
                renderApp();
            },

            selectPartner(partnerId) {
                const found = GAME_CONFIG.partners.find(p => p.id === partnerId);
                if (found) {
                    this.partner = found;
                    audioFX.playSuccess();
                    renderApp();
                }
            },

            startAdventure() {
                const nameInput = document.getElementById('trainer-name-input');
                if (!nameInput || nameInput.value.trim() === '') {
                    showToast('Please enter your Trainer Name before starting!', 'info');
                    if (nameInput) nameInput.focus();
                    return;
                }
                this.trainerName = nameInput.value.trim();
                audioFX.playFanfare();
                this.currentScreen = 'MAP';
                renderApp();
            },

            triggerTravelingAnimation(message, callback) {
                this.isTraveling = true;
                this.travelMessage = message;
                renderApp();
                audioFX.playFanfare();
                setTimeout(() => {
                    this.isTraveling = false;
                    if (callback) callback();
                }, 3000);
            },

            // HIGH-QUALITY & GLITCH-FREE AUDIO RECORDING PIPELINE
            startVoiceRecording(targetWord, durationSeconds = 3) {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    showToast('Microphone recording is not supported on this browser context. Simulated recording saved for report!', 'info');
                    this.saveSimulatedAudio(targetWord);
                    return;
                }

                if (this.isRecording) return;

                this.audioChunks = [];
                this.recordedAudioUrl = null;
                if (this.currentScreen === 'MISSION1') this.m1ListenedUserVoice = false;
                if (this.currentScreen === 'MISSION2') this.m2ListenedUserVoice = false;
                if (this.currentScreen === 'ASSESSMENT') this.assessmentTriedCurrent = true;

                const audioConstraints = {
                    audio: {
                        echoCancellation: { exact: true },
                        noiseSuppression: { exact: true },
                        autoGainControl: { exact: true },
                        channelCount: 1,
                        sampleRate: 44100
                    }
                };

                navigator.mediaDevices.getUserMedia(audioConstraints)
                    .catch(() => navigator.mediaDevices.getUserMedia({ audio: true }))
                    .then(stream => {
                        this.isRecording = true;
                        this.recordingTimeLeft = durationSeconds;
                        audioFX.playHop();
                        renderApp();

                        let selectedMimeType = '';
                        const mimeCandidates = [
                            'audio/webm;codecs=opus',
                            'audio/webm',
                            'audio/ogg;codecs=opus',
                            'audio/mp4',
                            'audio/aac'
                        ];
                        for (let type of mimeCandidates) {
                            if (MediaRecorder.isTypeSupported(type)) {
                                selectedMimeType = type;
                                break;
                            }
                        }

                        const options = selectedMimeType ? { mimeType: selectedMimeType, audioBitsPerSecond: 128000 } : {};
                        this.mediaRecorder = new MediaRecorder(stream, options);

                        this.mediaRecorder.ondataavailable = (e) => {
                            if (e.data && e.data.size > 0) {
                                this.audioChunks.push(e.data);
                            }
                        };

                        this.mediaRecorder.onstop = () => {
                            const blobType = selectedMimeType || 'audio/webm';
                            const audioBlob = new Blob(this.audioChunks, { type: blobType });
                            this.recordedAudioUrl = URL.createObjectURL(audioBlob);
                            
                            stream.getTracks().forEach(track => track.stop());

                            this.isRecording = false;
                            if (this.currentScreen === 'MISSION1') this.m1TriedCurrent = true;
                            if (this.currentScreen === 'MISSION2') this.m2ReadAttempted = true;
                            if (this.currentScreen === 'ASSESSMENT') this.assessmentTriedCurrent = true;

                            this.saveCurrentAudioLog(targetWord, this.recordedAudioUrl);

                            audioFX.playSuccess();
                            showToast(`Voice recorded crystal clear!`, 'success');
                            renderApp();
                        };

                        this.mediaRecorder.start(100);

                        this.recordingTimer = setInterval(() => {
                            this.recordingTimeLeft--;
                            if (this.recordingTimeLeft <= 0) {
                                clearInterval(this.recordingTimer);
                                if (this.mediaRecorder && this.mediaRecorder.state !== 'inactive') {
                                    setTimeout(() => {
                                        try { this.mediaRecorder.stop(); } catch(e) {}
                                    }, 150);
                                }
                            } else {
                                const timerEl = document.getElementById('rec-timer');
                                if (timerEl) timerEl.innerText = this.recordingTimeLeft + 's';
                            }
                        }, 1000);
                    })
                    .catch(err => {
                        console.warn('Microphone access blocked/denied:', err);
                        showToast(`Microphone fallback mode active!`, 'info');
                        this.saveSimulatedAudio(targetWord);
                    });
            },

            saveSimulatedAudio(targetWord) {
                this.recordedAudioUrl = null;
                if (this.currentScreen === 'MISSION1') {
                    this.m1TriedCurrent = true;
                    this.m1ListenedUserVoice = true;
                } else if (this.currentScreen === 'MISSION2') {
                    this.m2ReadAttempted = true;
                    this.m2ListenedUserVoice = true;
                } else if (this.currentScreen === 'ASSESSMENT') {
                    this.assessmentTriedCurrent = true;
                }
                this.saveCurrentAudioLog(targetWord, null);
                this.isRecording = false;
                if (this.recordingTimer) clearInterval(this.recordingTimer);
                audioFX.playSuccess();
                renderApp();
            },

            saveCurrentAudioLog(targetWord, audioUrl) {
                const logItem = {
                    word: targetWord,
                    audioUrl: audioUrl,
                    timestamp: new Date().toLocaleTimeString()
                };
                if (this.currentScreen === 'MISSION1') {
                    const idx = this.missionLogs.mission1.findIndex(i => i.word === targetWord);
                    if (idx >= 0) this.missionLogs.mission1[idx] = { ...this.missionLogs.mission1[idx], audioUrl, crystals: 2, status: 'Completed' };
                    else this.missionLogs.mission1.push({ word: targetWord, audioUrl, crystals: 2, status: 'Completed' });
                } else if (this.currentScreen === 'MISSION2') {
                    const idx = this.missionLogs.mission2.findIndex(i => i.word === targetWord);
                    const wordObj = GAME_CONFIG.targetWords[this.mission2Index];
                    if (idx >= 0) this.missionLogs.mission2[idx] = { ...this.missionLogs.mission2[idx], audioUrl, crystals: 2, status: 'Completed' };
                    else this.missionLogs.mission2.push({ word: targetWord, example: wordObj.example, audioUrl, crystals: 2, status: 'Completed' });
                } else if (this.currentScreen === 'MISSION3') {
                    const idx = this.missionLogs.mission3.findIndex(i => i.word === targetWord);
                    if (idx >= 0) this.missionLogs.mission3[idx] = { ...this.missionLogs.mission3[idx], audioUrl, crystals: 3, status: 'Completed' };
                    else this.missionLogs.mission3.push({ word: targetWord, audioUrl, crystals: 3, status: 'Completed' });
                } else if (this.currentScreen === 'ASSESSMENT') {
                    const wordObj = GAME_CONFIG.assessmentWords[this.assessmentIndex];
                    const idx = this.missionLogs.assessment.findIndex(i => i.word === wordObj.word);
                    const logData = {
                        wordId: wordObj.id,
                        word: wordObj.word,
                        soundGroup: wordObj.soundGroup,
                        audioUrl: audioUrl,
                        crystals: 0
                    };
                    if (idx >= 0) this.missionLogs.assessment[idx] = logData;
                    else this.missionLogs.assessment.push(logData);
                }
            },

            playUserRecordedAudio() {
                if (this.recordedAudioUrl) {
                    const audio = new Audio(this.recordedAudioUrl);
                    audio.play().catch(e => console.error("Audio play error", e));
                    if (this.currentScreen === 'MISSION1') this.m1ListenedUserVoice = true;
                    if (this.currentScreen === 'MISSION2') this.m2ListenedUserVoice = true;
                    if (this.currentScreen === 'MISSION3') this.m3UserVoiceListened = true;
                    showToast('Playing back recorded audio...', 'success');
                    renderApp();
                } else {
                    showToast('Playing audio recording clip!', 'info');
                    if (this.currentScreen === 'MISSION1') this.m1ListenedUserVoice = true;
                    if (this.currentScreen === 'MISSION2') this.m2ListenedUserVoice = true;
                    if (this.currentScreen === 'MISSION3') this.m3UserVoiceListened = true;
                    renderApp();
                }
            },

            playReportAudio(url) {
                if (url) {
                    const audio = new Audio(url);
                    audio.play().catch(e => console.error("Report audio error", e));
                    showToast('Playing student recording...', 'success');
                } else {
                    showToast('Playback active for recorded attempt.', 'info');
                }
            },

            nextMission1Platform(isLast) {
                if (!this.m1TriedCurrent) {
                    showToast('Record your voice blending correctly aloud before proceeding!', 'info');
                    return;
                }
                if (!this.m1ListenedUserVoice) {
                    showToast('Listen to your recorded voice first before moving on!', 'info');
                    return;
                }
                this.addCrystals(2);
                if (isLast) {
                    this.completedMissions.mission1 = true;
                    this.unlockedMissions.mission2 = true;
                    this.triggerTravelingAnimation("✨ Whispering Meadow Cleared! " + this.partner.name + " is walking to Route 102! ✨", () => {
                        this.resetCurrentMissionState();
                        this.currentScreen = 'MAP';
                        renderApp();
                    });
                } else {
                    this.mission1Index++;
                    this.resetCurrentMissionState();
                    renderApp();
                }
            },

            speakCurrentM1Word(word) {
                if (!this.m1TriedCurrent) {
                    showToast('Please record your voice blending the word aloud first!', 'info');
                    return;
                }
                if (!this.m1ListenedUserVoice) {
                    showToast('Please click "LISTEN MY VOICE" to check your recording before listening to Poké-Audio!', 'info');
                    return;
                }
                audioFX.speakWord(word);
            },

            checkMission2Word(wordClicked, targetWord) {
                if (wordClicked.toLowerCase() === targetWord.toLowerCase()) {
                    this.m2WordIdentified = true;
                    audioFX.playSuccess();
                    showToast('Correct! Target word found. Sentence recording step is now unlocked!', 'success');
                } else {
                    this.m2WordIdentified = false;
                    audioFX.playTone(180, 'sawtooth', 0.25);
                    showToast(`Incorrect! "${wordClicked}" is wrong. Look for "${targetWord}".`, 'info');
                }
                renderApp();
            },

            speakM2Sentence(sentence) {
                if (!this.m2WordIdentified) {
                    showToast('Tap and identify the target word in the sentence first!', 'info');
                    return;
                }
                if (!this.m2ReadAttempted || !this.m2ListenedUserVoice) {
                    showToast('Record and listen to your voice first!', 'info');
                    return;
                }
                audioFX.speakWord(sentence);
            },

            nextMission2Sentence() {
                const isLast = this.mission2Index === GAME_CONFIG.targetWords.length - 1;
                if (!this.m2WordIdentified) {
                    showToast('You must select the CORRECT target word in the sentence first!', 'info');
                    return;
                }
                if (!this.m2ReadAttempted) {
                    showToast('Please record yourself reading the sentence aloud (8s) first!', 'info');
                    return;
                }
                if (!this.m2ListenedUserVoice) {
                    showToast('Please listen to your voice attempt first!', 'info');
                    return;
                }
                this.addCrystals(2);
                if (isLast) {
                    this.completedMissions.mission2 = true;
                    this.unlockedMissions.mission3 = true;
                    this.triggerTravelingAnimation("🌊 Echo River Cleared! " + this.partner.name + " is walking to Sound Cave! 🌊", () => {
                        this.resetCurrentMissionState();
                        this.currentScreen = 'MAP';
                        renderApp();
                    });
                } else {
                    this.mission2Index++;
                    this.resetCurrentMissionState();
                    renderApp();
                }
            },

            selectMission3Choice(choiceWord, targetWord) {
                if (choiceWord.toLowerCase() === targetWord.toLowerCase()) {
                    this.m3Solved = true;
                    audioFX.playSuccess();
                    showToast('Correct crystal chosen! Step 2 unlocked: record reading full sentence (8s).', 'success');
                } else {
                    this.m3Solved = false;
                    audioFX.playTone(180, 'sawtooth', 0.25);
                    showToast(`Incorrect choice! "${choiceWord}" does not fit. Try again.`, 'info');
                }
                renderApp();
            },

            markM3FullSentenceReadAttempt(fullSentence, targetWord) {
                if (!this.m3Solved) {
                    showToast('Choose the correct crystal to complete the sentence first!', 'info');
                    return;
                }
                this.startVoiceRecording(targetWord, 8);
                this.m3ReadFullSentenceAttempted = true;
            },

            speakM3Sentence(fullSentence) {
                if (!this.m3Solved) {
                    showToast('Choose the correct crystal to complete the sentence first!', 'info');
                    return;
                }
                if (!this.m3ReadFullSentenceAttempted) {
                    showToast('Record and read the completed sentence aloud first!', 'info');
                    return;
                }
                if (!this.m3UserVoiceListened) {
                    showToast('Please click "3. LISTEN MY VOICE" to review your recording before listening to Poké-Audio!', 'info');
                    return;
                }
                this.m3AudioListened = true;
                audioFX.speakWord(fullSentence);
                showToast('Poké-Audio played successfully! You can now move to the next challenge!', 'success');
                renderApp();
            },

            nextMission3Challenge(isLast) {
                if (!this.m3Solved) {
                    showToast('You must choose the CORRECT crystal word to complete the blank first!', 'info');
                    return;
                }
                if (!this.m3ReadFullSentenceAttempted) {
                    showToast('Record yourself reading the full completed sentence aloud first!', 'info');
                    return;
                }
                if (!this.m3UserVoiceListened) {
                    showToast('Please listen to your recorded voice first before proceeding!', 'info');
                    return;
                }
                this.addCrystals(3);
                if (isLast) {
                    this.completedMissions.mission3 = true;
                    this.unlockedMissions.assessment = true;
                    this.triggerTravelingAnimation("💎 Sound Cave Cleared! " + this.partner.name + " is walking to the Pokémon League Arena! 💎", () => {
                        this.resetCurrentMissionState();
                        this.currentScreen = 'MAP';
                        renderApp();
                    });
                } else {
                    this.mission3Index++;
                    this.resetCurrentMissionState();
                    renderApp();
                }
            },

            nextAssessmentItem() {
                if (!this.assessmentTriedCurrent) {
                    showToast('Please record your voice blending aloud before proceeding!', 'info');
                    return;
                }

                if (this.assessmentIndex === GAME_CONFIG.assessmentWords.length - 1) {
                    this.completedMissions.assessment = true;
                    audioFX.playFanfare();
                    showToast('Assessment Completed! Entering Teacher Audio Report!', 'success');
                    setTimeout(() => {
                        this.currentScreen = 'RESULTS';
                        renderApp();
                    }, 1200);
                } else {
                    this.assessmentIndex++;
                    this.assessmentTriedCurrent = false;
                    this.recordedAudioUrl = null;
                    renderApp();
                }
            }
        };

        function showToast(message, type = "success") {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = "px-4 py-3 rounded-lg shadow-xl font-pixel text-[10px] sm:text-[11px] text-[#222] flex items-center gap-2 transform transition duration-300 translate-y-2 opacity-0 " + (
                type === 'success' ? 'bg-[#98ef98] border-3 border-[#2e7d32]' : 'bg-[#ffe082] border-3 border-[#f57f17]'
            );
            toast.innerHTML = '<i class="fa-solid ' + (type === 'success' ? 'fa-circle-check text-green-700' : 'fa-circle-info text-amber-800') + ' text-sm"></i> ' + message;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

                    </div>
                </div>
            `;
        }

        function renderResults() {
            const m1Crystals = gameState.missionLogs.mission1.reduce((sum, item) => sum + item.crystals, 0);
            const m2Crystals = gameState.missionLogs.mission2.reduce((sum, item) => sum + item.crystals, 0);
            const m3Crystals = gameState.missionLogs.mission3.reduce((sum, item) => sum + item.crystals, 0);
            const assessmentAwardedCount = Object.values(gameState.assessmentAwardedCrystals).filter(Boolean).length;

            return `
                <div class="min-h-[88vh] w-full max-w-5xl rounded-xl p-4 sm:p-8 flex flex-col justify-between pkmn-window shadow-2xl overflow-y-auto">
                    
                    <div class="text-center mb-4">
                        <div class="inline-flex items-center gap-2 bg-[#ffcb05] text-[#222] px-5 py-1 rounded font-pixel font-bold text-xs shadow mb-2 uppercase border-2 border-[#cc0000]">
                            🎙️ COMPLETE TEACHER AUDIO REPORT 🎙️
                        </div>
                        <h1 class="font-pixel text-lg sm:text-xl text-[#1a1a1a] font-extrabold">
                            STUDENT AUDIO RECORDINGS & EVALUATION LOG
                        </h1>
                        <p class="font-pixel text-xs text-[#cc0000] font-bold mt-1">
                            Trainer: <span class="text-[#222] underline">${gameState.trainerName.toUpperCase()}</span> | Partner: <span class="text-[#222] underline">${gameState.partner.name}</span> | Total Crystals: <span class="text-[#222] underline">${gameState.crystals} 💎</span>
                        </p>
                    </div>

                    <!-- Teacher Audio Log Breakdown -->
                    <div class="bg-[#f0f0f0] p-4 sm:p-6 rounded-xl border-3 border-[#707070] shadow-inner mb-6 space-y-4 text-left">
                        <div class="flex items-center justify-between border-b-2 border-[#ccc] pb-2">
                            <h2 class="font-pixel text-xs sm:text-sm text-[#222] font-bold flex items-center gap-2">
                                <i class="fa-solid fa-headphones text-[#cc0000]"></i> ALL RECORDED AUDIO CLIPS FOR TEACHER REVIEW
                            </h2>
                            <span class="font-pixel text-[10px] bg-[#2e7d32] text-white px-2.5 py-1 rounded">All Missions & Assessment</span>
                        </div>

                        <!-- Mission 1 Audio Log -->
                        <div class="bg-white p-3 rounded-lg border-2 border-[#81c784]">
                            <h3 class="font-pixel text-[10px] text-[#2e7d32] font-bold mb-2 flex items-center justify-between">
                                <span><i class="fa-solid fa-tree"></i> Route 101: Whispering Meadow (Onset + Vowel Team)</span>
                                <span class="bg-[#e8f5e9] px-2 py-0.5 rounded text-green-800">${m1Crystals} Crystals</span>
                            </h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                ${gameState.missionLogs.mission1.length > 0 ? gameState.missionLogs.mission1.map(item => `
                                    <div class="bg-[#f1f8e9] p-2.5 rounded border border-[#c8e6c9] flex items-center justify-between">
                                        <div>
                                            <span class="font-pixel text-[10px] text-[#222] block font-bold">Word: "${item.word}"</span>
                                            <span class="text-[9px] text-green-700 font-bold block">Status: Recorded & Verified</span>
                                        </div>
                                        <button onclick="gameState.playReportAudio('${item.audioUrl}')" class="bg-[#2e7d32] hover:bg-[#1b5e20] text-white font-pixel text-[9px] px-3 py-1.5 rounded shadow flex items-center gap-1.5">
                                            <i class="fa-solid fa-play"></i> Play Audio
                                        </button>
                                    </div>
                                `).join('') : '<p class="text-xs text-gray-500 italic p-2">No recordings completed for Mission 1.</p>'}
                            </div>
                        </div>

                        <!-- Mission 2 Audio Log -->
                        <div class="bg-white p-3 rounded-lg border-2 border-[#4fc3f7]">
                            <h3 class="font-pixel text-[10px] text-[#0288d1] font-bold mb-2 flex items-center justify-between">
                                <span><i class="fa-solid fa-water"></i> Route 102: Echo River (Sentence Reading)</span>
                                <span class="bg-[#e1f5fe] px-2 py-0.5 rounded text-sky-800">${m2Crystals} Crystals</span>
                            </h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                ${gameState.missionLogs.mission2.length > 0 ? gameState.missionLogs.mission2.map(item => `
                                    <div class="bg-[#e1f5fe] p-2.5 rounded border border-[#b3e5fc] flex items-center justify-between">
                                        <div class="pr-2 truncate">
                                            <span class="font-pixel text-[10px] text-[#01579b] block font-bold">Target: "${item.word}"</span>
                                            <span class="text-[9px] text-[#555] block truncate">Sentence: "${item.example}"</span>
                                        </div>
                                        <button onclick="gameState.playReportAudio('${item.audioUrl}')" class="bg-[#0288d1] hover:bg-[#01579b] text-white font-pixel text-[9px] px-3 py-1.5 rounded shadow flex items-center gap-1.5 shrink-0">
                                            <i class="fa-solid fa-play"></i> Play Audio
                                        </button>
                                    </div>
                                `).join('') : '<p class="text-xs text-gray-500 italic p-2">No recordings completed for Mission 2.</p>'}
                            </div>
                        </div>

                        <!-- Mission 3 Audio Log -->
                        <div class="bg-white p-3 rounded-lg border-2 border-[#ba68c8]">
                            <h3 class="font-pixel text-[10px] text-[#7b1fa2] font-bold mb-2 flex items-center justify-between">
                                <span><i class="fa-solid fa-gem"></i> Route 103: Sound Cave (Full Sentence Blank)</span>
                                <span class="bg-[#f3e5f5] px-2 py-0.5 rounded text-purple-800">${m3Crystals} Crystals</span>
                            </h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                ${gameState.missionLogs.mission3.length > 0 ? gameState.missionLogs.mission3.map(item => `
                                    <div class="bg-[#f3e5f5] p-2.5 rounded border border-[#e1bee7] flex items-center justify-between">
                                        <div>
                                            <span class="font-pixel text-[10px] text-[#4a148c] block font-bold">Word: "${item.word}"</span>
                                            <span class="text-[9px] text-purple-700 font-bold block">Status: Full Sentence Read</span>
                                        </div>
                                        <button onclick="gameState.playReportAudio('${item.audioUrl}')" class="bg-[#7b1fa2] hover:bg-[#4a148c] text-white font-pixel text-[9px] px-3 py-1.5 rounded shadow flex items-center gap-1.5">
                                            <i class="fa-solid fa-play"></i> Play Audio
                                        </button>
                                    </div>
                                `).join('') : '<p class="text-xs text-gray-500 italic p-2">No recordings completed for Mission 3.</p>'}
                            </div>
                        </div>

                        <!-- Assessment Audio Log & Interactive Teacher Evaluation -->
                        <div class="bg-white p-4 rounded-lg border-3 border-[#ef9a9a] shadow">
                            <h3 class="font-pixel text-[11px] text-[#c62828] font-bold mb-3 flex items-center justify-between border-b pb-2 border-red-200">
                                <span><i class="fa-solid fa-shield-cat"></i> Pokémon League Arena: Teacher Assessment & Marking</span>
                                <span class="bg-[#ffebee] border border-[#ef9a9a] px-2.5 py-0.5 rounded text-red-900 font-bold">${assessmentAwardedCount}/${GAME_CONFIG.assessmentWords.length} Crystals Awarded</span>
                            </h3>
                            <p class="text-xs text-gray-600 mb-3 font-bold">
                                👩‍🏫 <span class="underline">Teacher Evaluation Instructions:</span> Listen to the audio attempt, click the crystal button if the pupil blended the word correctly to award a crystal, and enter diagnostic assessment notes below.
                            </p>
                            <div class="grid grid-cols-1 gap-3">
                                ${gameState.missionLogs.assessment.length > 0 ? gameState.missionLogs.assessment.map(item => {
                                    const isAwarded = gameState.assessmentAwardedCrystals[item.word];
                                    const currentNote = gameState.assessmentTeacherNotes[item.word] || '';

                                    return `
                                        <div class="bg-[#fff5f5] p-3 rounded-lg border-2 border-[#ffcdd2] flex flex-col gap-2.5 shadow-sm">
                                            <div class="flex items-center justify-between flex-wrap gap-2">
                                                <div>
                                                    <span class="font-pixel text-xs text-[#b71c1c] font-bold">Target Word: "${item.word.toUpperCase()}"</span>
                                                    <span class="text-[10px] font-pixel text-gray-600 ml-2">Vowel Team: [${item.soundGroup}]</span>
                                                </div>

                                                <div class="flex items-center gap-2">
                                                    <button onclick="gameState.playReportAudio('${item.audioUrl}')" class="bg-[#e53935] hover:bg-[#b71c1c] text-white font-pixel text-[9px] px-3 py-1.5 rounded shadow flex items-center gap-1.5">
                                                        <i class="fa-solid fa-play"></i> Play Recording
                                                    </button>
                                                    <button onclick="gameState.toggleAssessmentCrystal('${item.word}')" class="font-pixel text-[9px] px-3 py-1.5 rounded shadow border-2 transition-all flex items-center gap-1.5 ${isAwarded ? 'bg-[#ffcb05] text-[#222] border-[#b38f00] font-extrabold ring-2 ring-yellow-400' : 'bg-gray-100 text-gray-600 border-gray-300 hover:bg-yellow-50'}">
                                                        <i class="fa-solid fa-gem ${isAwarded ? 'text-cyan-600 animate-pulse' : 'text-gray-400'}"></i> ${isAwarded ? 'CRYSTAL AWARDED (+1)' : 'AWARD CRYSTAL'}
                                                    </button>
                                                </div>
                                            </div>

                                            <div class="w-full">
                                                <label class="block text-[10px] font-pixel text-[#880e4f] mb-1 font-bold">
                                                    📝 TEACHER ASSESSMENT NOTES FOR "${item.word.toUpperCase()}":
                                                </label>
                                                <input type="text" 
                                                       value="${currentNote}" 
                                                       oninput="gameState.updateTeacherNote('${item.word}', this.value)"
                                                       placeholder="Type notes (e.g. Blended /r/-/ay/ accurately without pausing...)" 
                                                       class="w-full bg-white text-[#222] font-sans text-xs font-semibold p-2 rounded border-2 border-[#ef9a9a] focus:outline-none focus:border-[#c62828] shadow-inner">
                                            </div>
                                        </div>
                                    `;
                                }).join('') : '<p class="text-xs text-gray-500 italic p-2">No recordings completed for Assessment.</p>'}
                            </div>
                        </div>

                    </div>

                    <div class="text-center">
                        <button onclick="location.reload()" 
                                class="bg-[#cc0000] hover:bg-[#b30000] text-yellow-300 font-pixel text-xs sm:text-sm font-extrabold px-8 py-3.5 rounded-lg shadow border-3 border-[#222] transform active:scale-95 transition inline-flex items-center gap-2">
                            <i class="fa-solid fa-rotate-right"></i> PLAY AGAIN!
                        </button>
                    </div>

                </div>
            `;
        }

        function renderApp() {
            renderHeader();
            const container = document.getElementById('app-container');
            if (!container) return;

            if (gameState.currentScreen === 'HOME') container.innerHTML = renderHome();
            else if (gameState.currentScreen === 'MAP') container.innerHTML = renderMap();
            else if (gameState.currentScreen === 'MISSION1') container.innerHTML = renderMission1();
            else if (gameState.currentScreen === 'MISSION2') container.innerHTML = renderMission2();
            else if (gameState.currentScreen === 'MISSION3') container.innerHTML = renderMission3();
            else if (gameState.currentScreen === 'ASSESSMENT') container.innerHTML = renderAssessment();
            else if (gameState.currentScreen === 'RESULTS') container.innerHTML = renderResults();
        }

        window.onload = function() {
            initBackgroundCanvas();
            renderApp();
        };
    </script>
</body>
</html>
